name: Check
# Pull requests and the merge queue run the fast tier, a manual run the complete
# regression. A merge queue entry whose pull request has the full-gate label runs
# the complete regression too (docs/verification.md). Pushes to main and next and
# the weekly schedule run only the advisory scan (SECURITY.md). The queue tests
# each pull request on top of the ones ahead of it, so next never needs a branch
# updated by hand.
on:
  pull_request:
  merge_group:
  push:
    branches: [main, next]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forgetmenote-check-${{ github.event_name == 'workflow_dispatch' && 'full' || github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Known-advisory scan of reachable Go symbols and locked production npm packages.
  # Runs on every event, so a new advisory surfaces at the next one.
  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: npm audit --omit=dev --audit-level=low
  fast:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # Tests start their own cluster with the host's initdb, postgres and psql,
      # which Ubuntu's package keeps off PATH.
      - run: |
          .github/scripts/apt-install.sh openssl inotify-tools postgresql
          ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1 >> "$GITHUB_PATH"
      - run: make setup-deps
      - run: make check-fast
  # next can require full. A pull request run skips it, which GitHub reports as
  # Success, so the gate runs on the queue's combined commit instead. Entries
  # without the label succeed in seconds, beside fast. The decision is a step here,
  # not a job full needs: a job whose `needs` failed is skipped, and would pass.
  full:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group'
    # The complete regression on a standard 2-core runner takes 35-49 minutes. The
    # queue drops an entry whose checks report nothing in 90, so a stuck gate fails
    # first, uploading its logs.
    runs-on: ubuntu-latest
    timeout-minutes: 80
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: gate
        run: .github/scripts/full-gate-needed.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # Playwright's browser downloads, keyed by the browsers and the locked Playwright version.
      - if: steps.gate.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # The Actions cache backend for image layers needs a docker-container builder
      # and the cache service token in run steps; FMN_IMAGE_CACHE selects it below.
      - if: steps.gate.outputs.run == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.gate.outputs.run == 'true'
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      # Tests start their own cluster with the host's initdb, postgres and psql,
      # which Ubuntu's package keeps off PATH. Source tests drive the real parsers
      # on the host; smoke-source repeats them with the image's pinned versions.
      - if: steps.gate.outputs.run == 'true'
        run: |
          .github/scripts/apt-install.sh openssl inotify-tools postgresql ffmpeg poppler-utils tesseract-ocr
          ls -d /usr/lib/postgresql/*/bin | sort -V | tail -n 1 >> "$GITHUB_PATH"
      - if: steps.gate.outputs.run == 'true'
        run: make setup-deps setup-browser
      - if: steps.gate.outputs.run == 'true'
        run: python deploy/production/release_image.py --verify-only --mode full --jobs 2
        timeout-minutes: 65
        env:
          FMN_IMAGE_CACHE: gha
      # The gate prints only the end of a failed check's log. Its full logs, browser
      # report and traces hold synthetic test data; the Actions runtime token reaches
      # only the image build (release_image.py), and anyone signed in can read this.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gate-failure-${{ github.run_attempt }}
          path: |
            ~/.cache/forgetmenote/releases/${{ github.sha }}/*.log
            ~/.cache/forgetmenote/releases/${{ github.sha }}/*.report.json
            ~/.cache/forgetmenote/releases/${{ github.sha }}/verification.json
            ~/.cache/forgetmenote/releases/${{ github.sha }}/browser-*-results/
          retention-days: 7
