# Example only. Create these Secrets first:
#   owner-alpha, owner-beta: a random "token" key of at least 32 bytes each.
#   forgetmenote-database: a "url" key, the Postgres URL (docs/postgres.md).
#   forgetmenote-recovery: an "admin.token" key, a random recovery key of at
#     least 32 characters. Every gateway must hold the same one.
# Replace image references, PUBLIC_URL, the bucket and the role annotation.
# Requires NetworkPolicy enforcement and CSI ReadWriteOncePod support.
apiVersion: v1
kind: Namespace
metadata:
  name: forgetmenote
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notebook-owner-map
  namespace: forgetmenote
data:
  owners.json: |
    {
      "alpha": {"url":"http://notebook-owner-alpha:8080","secretFile":"/run/secrets/alpha/token","allowHTTP":true},
      "beta": {"url":"http://notebook-owner-beta:8080","secretFile":"/run/secrets/beta/token","allowHTTP":true,"placeNew":true}
    }
---
# Gateways keep blobs in S3 so any of them can serve an export, source job or
# repository source another one began (docs/postgres.md, Blob storage).
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgetmenote-blobs
  namespace: forgetmenote
data:
  blobs.json: |
    {"s3": {"bucket": "forgetmenote-example", "prefix": "instance", "region": "us-east-1"}}
---
# The gateway reads S3 through the AWS default credential chain. Grant this
# account a role limited to the bucket prefix through your cluster's workload
# identity, such as IRSA's role annotation or an EKS Pod Identity association.
# When the gateway's environment also holds AWS keys for something else, name
# the IRSA role as "roleArn" in blobs.json so those keys never sign blob requests.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgetmenote-gateway
  namespace: forgetmenote
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/forgetmenote-blobs
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: owner-alpha-data
  namespace: forgetmenote
spec:
  accessModes: [ReadWriteOncePod]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: owner-beta-data
  namespace: forgetmenote
spec:
  accessModes: [ReadWriteOncePod]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notebook-gateway
  namespace: forgetmenote
spec:
  # Gateways keep no notebook and no durable state of their own, so several
  # serve at once and a rollout replaces them one at a time.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: forgetmenote, role: gateway}
  template:
    metadata:
      labels: {app: forgetmenote, role: gateway}
    spec:
      serviceAccountName: forgetmenote-gateway
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, runAsNonRoot: true}
      # Serving never migrates. Each new gateway applies the image's migrations
      # first; they take an advisory lock and work with the running release.
      initContainers:
        - name: migrate
          image: registry.example/forgetmenote:reviewed
          args: [migrate]
          env:
            - {name: DATABASE_URL_FILE, value: /run/secrets/database/url}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: database, mountPath: /run/secrets/database, readOnly: true}
      containers:
        - name: gateway
          image: registry.example/forgetmenote:reviewed
          env:
            - {name: PUBLIC_URL, value: "https://notes.example.com"}
            - {name: OWNER_MAP_FILE, value: /run/config/owners.json}
            - {name: DATABASE_URL_FILE, value: /run/secrets/database/url}
            - {name: BLOBS_CONFIG_FILE, value: /run/config/blobs/blobs.json}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 4Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: recovery, mountPath: /data/admin.token, subPath: admin.token, readOnly: true}
            - {name: temporary, mountPath: /tmp}
            - {name: config, mountPath: /run/config, readOnly: true}
            - {name: blobs, mountPath: /run/config/blobs, readOnly: true}
            - {name: database, mountPath: /run/secrets/database, readOnly: true}
            - {name: alpha-secret, mountPath: /run/secrets/alpha, readOnly: true}
            - {name: beta-secret, mountPath: /run/secrets/beta, readOnly: true}
      volumes:
        # Only derived data: repository mirrors and indexes, note map and history
        # caches and Python environments, rebuilt after a restart.
        - name: data
          emptyDir: {sizeLimit: 10Gi}
        - name: recovery
          secret: {secretName: forgetmenote-recovery, defaultMode: 0440}
        - name: temporary
          emptyDir: {sizeLimit: 4Gi}
        - name: config
          configMap: {name: notebook-owner-map}
        - name: blobs
          configMap: {name: forgetmenote-blobs}
        - name: database
          secret: {secretName: forgetmenote-database, defaultMode: 0440}
        - name: alpha-secret
          secret: {secretName: owner-alpha, defaultMode: 0440}
        - name: beta-secret
          secret: {secretName: owner-beta, defaultMode: 0440}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: notebook-gateway
  namespace: forgetmenote
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: forgetmenote, role: gateway}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notebook-owner-alpha
  namespace: forgetmenote
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: forgetmenote, role: owner, notebook: alpha}
  template:
    metadata:
      labels: {app: forgetmenote, role: owner, notebook: alpha}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, runAsNonRoot: true}
      containers:
        - name: owner
          image: registry.example/forgetmenote:reviewed
          args: [owner]
          env:
            - {name: OWNER_SECRET_FILE, value: /run/secrets/owner/token}
            - {name: OWNER_ALLOW_HTTP, value: "true"}
            # Two gateways, plus the one a rolling update adds.
            - {name: OWNER_GATEWAYS, value: "3"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 4Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: temporary, mountPath: /tmp}
            - {name: secret, mountPath: /run/secrets/owner, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: owner-alpha-data}
        - name: temporary
          emptyDir: {sizeLimit: 4Gi}
        - name: secret
          secret: {secretName: owner-alpha, defaultMode: 0440}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notebook-owner-beta
  namespace: forgetmenote
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: forgetmenote, role: owner, notebook: beta}
  template:
    metadata:
      labels: {app: forgetmenote, role: owner, notebook: beta}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext: {runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, runAsNonRoot: true}
      containers:
        - name: owner
          image: registry.example/forgetmenote:reviewed
          args: [owner]
          env:
            - {name: OWNER_SECRET_FILE, value: /run/secrets/owner/token}
            - {name: OWNER_ALLOW_HTTP, value: "true"}
            # Two gateways, plus the one a rolling update adds.
            - {name: OWNER_GATEWAYS, value: "3"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 4Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: temporary, mountPath: /tmp}
            - {name: secret, mountPath: /run/secrets/owner, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: owner-beta-data}
        - name: temporary
          emptyDir: {sizeLimit: 4Gi}
        - name: secret
          secret: {secretName: owner-beta, defaultMode: 0440}
---
apiVersion: v1
kind: Service
metadata:
  name: notebook-gateway
  namespace: forgetmenote
spec:
  selector: {app: forgetmenote, role: gateway}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: notebook-owner-alpha
  namespace: forgetmenote
spec:
  selector: {app: forgetmenote, role: owner, notebook: alpha}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: notebook-owner-beta
  namespace: forgetmenote
spec:
  selector: {app: forgetmenote, role: owner, notebook: beta}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: private-notebook-owners
  namespace: forgetmenote
spec:
  podSelector:
    matchLabels: {app: forgetmenote, role: owner}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: forgetmenote, role: gateway}
      ports: [{protocol: TCP, port: 8080}]
  egress: []
# Gateways reach owners, Postgres, S3 and the configured identity and AI
# providers, so their egress is left open here. Restrict Postgres to gateway
# pods with its own security group or NetworkPolicy.
